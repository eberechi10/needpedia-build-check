name: Daily Needpedia build check

on:
  schedule:
    # Once a day at 07:23 UTC. Change the time here if Tony wants another.
    - cron: '5 20 * * *'
  # The manual "Run workflow" button.
  workflow_dispatch:

env:
  # ============================================================
  # SETTINGS — change these, not the steps below.
  # ============================================================
  NEEDPEDIA_REPO: Queuevius/Needpedia
  NEEDPEDIA_BRANCH: master   # Needpedia's default branch
  RESULTS_DIR: results
  WEB_PORT: 3000
  COMPOSE_FILE: docker-compose.check.yml
  # ============================================================

permissions:
  contents: write   # lets the built-in GITHUB_TOKEN commit the results

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Clone Needpedia
        run: |
          git clone --depth 1 --branch "$NEEDPEDIA_BRANCH" \
            "https://github.com/$NEEDPEDIA_REPO.git" needpedia
          echo "NEEDPEDIA_COMMIT=$(git -C needpedia rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run build check (build -> database -> start -> page)
        run: bash run-check.sh

      - name: Write results
        if: always()
        run: python3 write-results.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$RESULTS_DIR"
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Record daily build check result [skip ci]"
            git push
          fi
