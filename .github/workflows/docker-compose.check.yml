# Harness for the daily build check. The web image is built from
# Needpedia's own Dockerfile, unchanged. The env values match
# Needpedia's own docker-compose.yml (web service).
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: needpedia
      POSTGRES_PASSWORD: needpedia
      POSTGRES_DB: needpedia_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needpedia -d needpedia_development"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ./needpedia
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://needpedia:needpedia@db:5432/needpedia_development
      REDIS_URL: redis://redis:6379/1
      DISABLE_FIREBASE: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
